name: build-installer

# Builds a GCC-linked Talos installer image + USB ISO for legacy Intel Mac minis.
# Installer image -> ghcr.io/<owner>/talos-mac/installer:<version>
# ISO             -> attached to a GitHub Release named after the version.

# Builds when Renovate updates versions.env on main, or when manually dispatched.
# Pull requests do not build because kernel compiles are expensive.
on:
  push:
    branches: ["main"]
    paths: ["versions.env"]
  workflow_dispatch:
    inputs:
      talos_version:
        description: "TALOS_VERSION to build (e.g. v1.13.5). Defaults to versions.env."
        required: false
        type: string

permissions:
  contents: write   # create releases / upload ISO
  packages: write   # push images to GHCR

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Kernel build + Talos artifacts blow past the stock 14GB runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Load versions.env
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' versions.env >> "$GITHUB_ENV"
          # Version precedence: dispatch input > versions.env default.
          override="${{ inputs.talos_version }}"
          if [ -n "$override" ]; then
            sed -i '/^TALOS_VERSION=/d' "$GITHUB_ENV"
            echo "TALOS_VERSION=$override" >> "$GITHUB_ENV"
          fi

      - name: Set registry
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/talos-mac" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.21.7

      - name: Login GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          chmod +x scripts/*.sh
          scripts/build.sh

      - name: Upload ISO to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TALOS_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Talos ${{ env.TALOS_VERSION }} (legacy Intel Mac, GCC kernel)
          files: _out/*.iso
          fail_on_unmatched_files: true
          body: |
            GCC-linked Talos ${{ env.TALOS_VERSION }} for Macmini5,3 and Macmini6,1 (issue #13579).
            Installer image: `${{ env.REGISTRY }}/installer:${{ env.TALOS_VERSION }}`
